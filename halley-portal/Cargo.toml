[package]
name = "halley-portal"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xdg-desktop-portal-halley"
path = "src/main.rs"

[dependencies]
eventline = "0.9.0"
gbm = "0.18"
halley-ipc = { path = "../halley-ipc" }
libc = "0.2"
pollster = "0.4"
pipewire = { version = "0.10", features = ["v0_3_34"] }
zbus = "5.16"
